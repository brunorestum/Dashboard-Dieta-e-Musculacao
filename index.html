      { data: "03/08", atividade: "Esteira 5,5 km/h", minutos: 45, met: 5.3 },

    ];

    // ============================================================
    // CONFIGURAÇÕES E ESTILOS

    const COLORS = {
      bg: "#12110F",
      panel: "#1B1917",
      panelBorder: "#2C2924",
      cream: "#F4EFE6",
      muted: "#9A9184",
      protein: "#E8A458",
      carb: "#7FA88F",
      fat: "#C97B63",
      voce: "#E8A458",
      esposa: "#7FA88F",
      track: "#2C2924",
    };

    const PESO_USUARIO_KG = 69.4;
    const PESO_RAISSA_KG = 50;

    function kcalCardio(met, pesoKg, minutos, kcalReal) {
      if (kcalReal != null) return kcalReal;
      return Math.round(met * pesoKg * (minutos / 60));
    }

    function kcalFromMacro(p, c, g) {
      return Math.round(p * 4 + c * 4 + g * 9);
    }

    function dataParaOrdenar(dataStr) {
      const [dia, mes] = dataStr.split("/").map(Number);
      return mes * 100 + dia;
    }

    const MET_MUSCULACAO = 4.5;
    const DURACAO_SESSAO_HORAS = 1;

    function kcalMusculacaoSessao(pesoKg, horas = DURACAO_SESSAO_HORAS) {
      return Math.round(MET_MUSCULACAO * pesoKg * horas);
    }

    const KCAL_MEDIDAS_TREINO = [
      { data: "03/08", sessao: "Upper", pessoa: "voce", kcal: 354 },
    ];

    function buscarKcalMedida(data, sessao, pessoa) {
      const registro = KCAL_MEDIDAS_TREINO.find(
        (k) => k.data === data && k.sessao === sessao && k.pessoa === pessoa
      );
      return registro ? registro.kcal : null;
    }

    // ============================================================
    // COMPONENTES DE UI
    // ============================================================

    function RingStat({ label, value, meta, unit, color }) {
      const pct = Math.min(100, (value / meta) * 100);
      const r = 42;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      const over = value > meta;

      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
          <div style={{ position: "relative", width: 100, height: 100 }}>
            <svg width="100" height="100" viewBox="0 0 100 100" style={{ transform: "rotate(-90deg)" }}>
              <circle cx="50" cy="50" r={r} fill="none" stroke={COLORS.track} strokeWidth="7" />
              <circle
                cx="50"
                cy="50"
                r={r}
                fill="none"
                stroke={over ? "#C97B63" : color}
                strokeWidth="7"
                strokeDasharray={circ}
                strokeDashoffset={offset}
                strokeLinecap="round"
                style={{ transition: "stroke-dashoffset 0.6s ease" }}
              />
            </svg>
            <div
              style={{
                position: "absolute",
                inset: 0,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
              }}
            >
              <span style={{ fontSize: 20, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                {value}
              </span>
              <span style={{ fontSize: 10, color: COLORS.muted }}>/{meta}{unit}</span>
            </div>
          </div>
          <span style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted }}>
            {label}
          </span>
        </div>
      );
    }

    function BarraContribuicao({ alimento, proteina, carbo, gordura }) {
      const total = proteina + carbo + gordura;
      const pP = total ? (proteina / total) * 100 : 0;
      const pC = total ? (carbo / total) * 100 : 0;
      const pG = total ? (gordura / total) * 100 : 0;
      const kcal = kcalFromMacro(proteina, carbo, gordura);

      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
            <span style={{ fontSize: 13, color: COLORS.cream }}>{alimento}</span>
            <span style={{ fontSize: 12, color: COLORS.muted }}>{kcal} kcal</span>
          </div>
          <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden", background: COLORS.track }}>
            {pP > 0 && <div style={{ width: `${pP}%`, background: COLORS.protein }} />}
            {pC > 0 && <div style={{ width: `${pC}%`, background: COLORS.carb }} />}
            {pG > 0 && <div style={{ width: `${pG}%`, background: COLORS.fat }} />}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
            <span style={{ fontSize: 11, color: COLORS.protein }}>P {proteina}g</span>
            <span style={{ fontSize: 11, color: COLORS.carb }}>C {carbo}g</span>
            <span style={{ fontSize: 11, color: COLORS.fat }}>G {gordura}g</span>
          </div>
        </div>
      );
    }

    function MacrosPanel({ titulo, alimentos, meta }) {
      const dias = useMemo(() => {
        const seen = [];
        alimentos.forEach((a) => {
          if (!seen.includes(a.data)) seen.push(a.data);
        });
        return seen.sort((a, b) => dataParaOrdenar(a) - dataParaOrdenar(b));
      }, [alimentos]);

      const [diaSelecionado, setDiaSelecionado] = useState(dias[dias.length - 1] || null);
      const diaValido = dias.includes(diaSelecionado) ? diaSelecionado : dias[dias.length - 1];

      const alimentosDoDia = alimentos
        .filter((a) => a.data === diaValido)
        .slice()
        .sort((a, b) => kcalFromMacro(b.proteina, b.carbo, b.gordura) - kcalFromMacro(a.proteina, a.carbo, a.gordura));

      const p = alimentosDoDia.reduce((s, a) => s + a.proteina, 0);
      const c = alimentosDoDia.reduce((s, a) => s + a.carbo, 0);
      const g = alimentosDoDia.reduce((s, a) => s + a.gordura, 0);
      const kcal = kcalFromMacro(p, c, g);
      const kcalMeta = meta.kcal;

      const chartData = dias.map((d) => {
        const itens = alimentos.filter((a) => a.data === d);
        const dp = itens.reduce((s, a) => s + a.proteina, 0);
        const dc = itens.reduce((s, a) => s + a.carbo, 0);
        const dg = itens.reduce((s, a) => s + a.gordura, 0);
        return { data: d, kcal: kcalFromMacro(dp, dc, dg), meta: kcalMeta };
      });

      return (
        <div style={panelStyle}>
          <div style={panelHeader}>
            <div>
              <div style={eyebrow}>Nutrição</div>
              <h2 style={panelTitle}>{titulo}</h2>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                {kcal}
                <span style={{ fontSize: 14, color: COLORS.muted, fontWeight: 400 }}> / {kcalMeta} kcal</span>
              </div>
            </div>
          </div>

          {dias.length === 0 ? (
            <EmptyState text="Nenhum registro ainda." />
          ) : (
            <>
              {dias.length > 1 && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 16 }}>
                  {dias.map((d) => (
                    <button
                      key={d}
                      onClick={() => setDiaSelecionado(d)}
                      style={{
                        padding: "6px 12px",
                        borderRadius: 20,
                        border: `1px solid ${d === diaValido ? COLORS.protein : COLORS.panelBorder}`,
                        background: d === diaValido ? `${COLORS.protein}22` : "transparent",
                        color: d === diaValido ? COLORS.cream : COLORS.muted,
                        fontSize: 12,
                        cursor: "pointer",
                        fontFamily: "inherit",
                      }}
                    >
                      {d}
                    </button>
                  ))}
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "space-around", padding: "24px 0" }}>
                <RingStat label="Proteína" value={Math.round(p * 10) / 10} meta={meta.proteina} unit="g" color={COLORS.protein} />
                <RingStat label="Carboidrato" value={Math.round(c * 10) / 10} meta={meta.carbo} unit="g" color={COLORS.carb} />
                <RingStat label="Gordura" value={Math.round(g * 10) / 10} meta={meta.gordura} unit="g" color={COLORS.fat} />
              </div>

              <div style={{ marginTop: 4 }}>
                <div style={eyebrow}>Contribuição por alimento</div>
                <div style={{ marginTop: 12 }}>
                  {alimentosDoDia.map((a, i) => (
                    <BarraContribuicao key={i} alimento={a.alimento} proteina={a.proteina} carbo={a.carbo} gordura={a.gordura} />
                  ))}
                </div>
              </div>

              {chartData.length > 1 && window.Recharts && (
                <div style={{ height: 160, marginTop: 16 }}>
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={chartData} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
                      <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                      <XAxis dataKey="data" stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                      <YAxis stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                      <Tooltip
                        contentStyle={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8 }}
                        labelStyle={{ color: COLORS.cream }}
                      />
                      <Line type="monotone" dataKey="kcal" stroke={COLORS.protein} strokeWidth={2} dot={{ r: 3 }} name="Kcal consumidas" />
                      <Line type="monotone" dataKey="meta" stroke={COLORS.muted} strokeWidth={1.5} strokeDasharray="4 4" dot={false} name="Meta" />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function EmptyState({ text }) {
      return (
        <div
          style={{
            padding: "40px 20px",
            textAlign: "center",
            color: COLORS.muted,
            fontSize: 13,
            border: `1px dashed ${COLORS.panelBorder}`,
            borderRadius: 10,
            marginTop: 12,
          }}
        >
          {text}
        </div>
      );
    }

    function TreinoPanel({ titulo, dados, cor, pesoKg, pessoa }) {
      const sessoes = useMemo(() => {
        const set = new Set(dados.map((d) => d.sessao || "Geral"));
        return Array.from(set);
      }, [dados]);

      const sessaoMaisRecente = useMemo(() => {
        if (!dados.length) return sessoes[0] || null;
        const maisRecente = dados.reduce((max, d) =>
          dataParaOrdenar(d.data) > dataParaOrdenar(max.data) ? d : max
        );
        return maisRecente.sessao || "Geral";
      }, [dados, sessoes]);

      const [sessaoSelecionada, setSessaoSelecionada] = useState(sessaoMaisRecente);

      const dadosDaSessao = useMemo(
        () => dados.filter((d) => (d.sessao || "Geral") === sessaoSelecionada),
        [dados, sessaoSelecionada]
      );

      const nomesExercicios = useMemo(() => {
        const set = new Set(dadosDaSessao.map((d) => d.exercicio));
        return Array.from(set);
      }, [dadosDaSessao]);

      const [exercicioProgresso, setExercicioProgresso] = useState(nomesExercicios[0] || null);
      const exercicioValido = nomesExercicios.includes(exercicioProgresso) ? exercicioProgresso : nomesExercicios[0];

      const serieProgresso = dadosDaSessao
        .filter((d) => d.exercicio === exercicioValido)
        .slice()
        .sort((a, b) => dataParaOrdenar(a.data) - dataParaOrdenar(b.data));
      const unidade = serieProgresso.length ? (serieProgresso[0].unidade || "kg") : "kg";
      const cargaAtual = serieProgresso.length ? serieProgresso[serieProgresso.length - 1].carga : null;
      const cargaInicial = serieProgresso.length ? serieProgresso[0].carga : null;
      const progresso = cargaAtual && cargaInicial && cargaInicial !== 0 ? (((cargaAtual - cargaInicial) / cargaInicial) * 100).toFixed(1) : null;

      const trocarSessao = (s) => {
        setSessaoSelecionada(s);
        setExercicioProgresso(null);
      };

      const ultimaData = dadosDaSessao.length
        ? dadosDaSessao.reduce((max, d) => (dataParaOrdenar(d.data) > dataParaOrdenar(max.data) ? d : max)).data
        : null;
      const kcalMedida = ultimaData ? buscarKcalMedida(ultimaData, sessaoSelecionada, pessoa) : null;
      const kcalSessao = kcalMedida != null ? kcalMedida : (ultimaData ? kcalMusculacaoSessao(pesoKg) : 0);
      const kcalEhMedida = kcalMedida != null;

      return (
        <div style={panelStyle}>
          <div style={panelHeader}>
            <div>
              <div style={eyebrow}>Treino</div>
              <h2 style={panelTitle}>{titulo}</h2>
            </div>
            {kcalSessao > 0 && (
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                  {kcalEhMedida ? "" : "~"}{kcalSessao} kcal
                </div>
                <div style={{ fontSize: 10, color: COLORS.muted }}>
                  {kcalEhMedida ? "medido" : "estimado"} · {ultimaData}
                </div>
              </div>
            )}
          </div>

          {sessoes.length === 0 ? (
            <EmptyState text="Sem registros de treino." />
          ) : (
            <>
              {sessoes.length > 1 && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 16 }}>
                  {sessoes.map((s) => (
                    <button
                      key={s}
                      onClick={() => trocarSessao(s)}
                      style={{
                        padding: "5px 12px",
                        borderRadius: 8,
                        border: "none",
                        background: s === sessaoSelecionada ? COLORS.cream : "transparent",
                        color: s === sessaoSelecionada ? COLORS.bg : COLORS.muted,
                        fontSize: 11,
                        fontWeight: 600,
                        cursor: "pointer",
                        fontFamily: "inherit",
                      }}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              )}

              {nomesExercicios.length > 0 && (
                <div style={{ marginTop: 20 }}>
                  <div style={eyebrow}>Exercício</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "8px 0 12px" }}>
                    {nomesExercicios.map((n) => (
                      <button
                        key={n}
                        onClick={() => setExercicioProgresso(n)}
                        style={{
                          padding: "6px 12px",
                          borderRadius: 20,
                          border: `1px solid ${n === exercicioValido ? cor : COLORS.panelBorder}`,
                          background: n === exercicioValido ? `${cor}22` : "transparent",
                          color: n === exercicioValido ? COLORS.cream : COLORS.muted,
                          fontSize: 12,
                          cursor: "pointer",
                          fontFamily: "inherit",
                        }}
                      >
                        {n}
                      </button>
                    ))}
                  </div>

                  {cargaAtual != null && (
                    <div style={{ marginBottom: 8 }}>
                      <span style={{ fontSize: 22, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                        {cargaAtual}{unidade}
                      </span>
                      {progresso != null && (
                        <span style={{ fontSize: 12, color: progresso >= 0 ? cor : "#C97B63", marginLeft: 10 }}>
                          {progresso >= 0 ? "▲" : "▼"} {Math.abs(progresso)}%
                        </span>
                      )}
                    </div>
                  )}

                  {window.Recharts && (
                    <div style={{ height: 180 }}>
                      <ResponsiveContainer width="100%" height="100%">
                        <LineChart data={serieProgresso} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
                          <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                          <XAxis dataKey="data" stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                          <YAxis stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} unit={unidade} />
                          <Tooltip
                            contentStyle={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8 }}
                            labelStyle={{ color: COLORS.cream }}
                          />
                          <Line type="monotone" dataKey="carga" stroke={cor} strokeWidth={2.5} dot={{ r: 4, fill: cor }} name={`Carga (${unidade})`} />
                        </LineChart>
                      </ResponsiveContainer>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function CardioPanel({ titulo, dados, cor, pesoKg }) {
      const dias = useMemo(() => {
        const seen = [];
        dados.forEach((d) => {
          if (!seen.includes(d.data)) seen.push(d.data);
        });
        return seen;
      }, [dados]);

      const totalKcal = dados.reduce((s, d) => s + kcalCardio(d.met, pesoKg, d.minutos, d.kcalReal), 0);
      const totalMinutos = dados.reduce((s, d) => s + d.minutos, 0);

      const chartData = dias.map((d) => {
        const itens = dados.filter((x) => x.data === d);
        const kcal = itens.reduce((s, x) => s + kcalCardio(x.met, pesoKg, x.minutos, x.kcalReal), 0);
        return { data: d, kcal };
      });

      return (
        <div style={panelStyle}>
          <div style={panelHeader}>
            <div>
              <div style={eyebrow}>Cardio</div>
              <h2 style={panelTitle}>{titulo}</h2>
            </div>
            {totalKcal > 0 && (
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 20, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                  ~{totalKcal} kcal
                </div>
                <div style={{ fontSize: 10, color: COLORS.muted }}>{totalMinutos} min total</div>
              </div>
            )}
          </div>

          {dados.length === 0 ? (
            <EmptyState text="Sem registros de cardio." />
          ) : (
            <>
              <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
                {dados.map((d, i) => (
                  <div
                    key={i}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      padding: "10px 12px",
                      background: COLORS.bg,
                      borderRadius: 8,
                      border: `1px solid ${COLORS.panelBorder}`,
                    }}
                  >
                    <div>
                      <div style={{ fontSize: 13, color: COLORS.cream }}>{d.atividade}</div>
                      <div style={{ fontSize: 11, color: COLORS.muted }}>{d.data} · {d.minutos} min</div>
                    </div>
                    <span style={{ fontSize: 13, color: cor, fontWeight: 600 }}>
                      {d.kcalReal != null ? "" : "~"}{kcalCardio(d.met, pesoKg, d.minutos, d.kcalReal)} kcal
                    </span>
                  </div>
                ))}
              </div>

              {chartData.length > 1 && window.Recharts && (
                <div style={{ height: 160, marginTop: 20 }}>
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={chartData} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
                      <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                      <XAxis dataKey="data" stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                      <YAxis stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                      <Tooltip
                        contentStyle={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8 }}
                        labelStyle={{ color: COLORS.cream }}
                      />
                      <Line type="monotone" dataKey="kcal" stroke={cor} strokeWidth={2.5} dot={{ r: 4, fill: cor }} name="Kcal gastas" />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    const panelStyle = {
      background: COLORS.panel,
      border: `1px solid ${COLORS.panelBorder}`,
      borderRadius: 16,
      padding: 24,
    };

    const panelHeader = { display: "flex", justifyContent: "space-between", alignItems: "flex-start" };

    const eyebrow = {
      fontSize: 11,
      letterSpacing: "0.12em",
      textTransform: "uppercase",
      color: COLORS.muted,
      marginBottom: 4,
    };

    const panelTitle = {
      fontSize: 22,
      fontWeight: 600,
      color: COLORS.cream,
      fontFamily: "'Fraunces', serif",
      margin: 0,
    };

    function SectionLabel({ text }) {
      return (
        <div
          style={{
            fontSize: 11,
            letterSpacing: "0.15em",
            textTransform: "uppercase",
            color: COLORS.muted,
            margin: "8px 4px",
          }}
        >
          {text}
        </div>
      );
    }

    function Dashboard() {
      return (
        <div
          style={{
            minHeight: "100vh",
            background: COLORS.bg,
            padding: "32px 20px",
            fontFamily: "'Inter', -apple-system, sans-serif",
          }}
        >
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');
          `}</style>

          <div style={{ maxWidth: 480, margin: "0 auto 28px" }}>
            <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: COLORS.muted }}>
              Painel diário
            </div>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 32, color: COLORS.cream, margin: "4px 0 0" }}>
              Progresso
            </h1>
          </div>

          <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", gap: 20 }}>
            <SectionLabel text="Você" />
            <MacrosPanel titulo="Macros" alimentos={ALIMENTOS_VOCE} meta={META_VOCE} />
            <TreinoPanel titulo="Seu treino" dados={TREINO_VOCE} cor={COLORS.voce} pesoKg={PESO_USUARIO_KG} pessoa="voce" />
            <CardioPanel titulo="Seu cardio" dados={CARDIO_VOCE} cor={COLORS.voce} pesoKg={PESO_USUARIO_KG} />

            <SectionLabel text={TREINO_ESPOSA_NOME} />
            <MacrosPanel titulo={`Macros · ${TREINO_ESPOSA_NOME}`} alimentos={ALIMENTOS_ESPOSA} meta={META_ESPOSA} />
            <TreinoPanel titulo={`Treino · ${TREINO_ESPOSA_NOME}`} dados={TREINO_ESPOSA} cor={COLORS.esposa} pesoKg={PESO_RAISSA_KG} pessoa="esposa" />
            <CardioPanel titulo={`Cardio · ${TREINO_ESPOSA_NOME}`} dados={CARDIO_ESPOSA} cor={COLORS.esposa} pesoKg={PESO_RAISSA_KG} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
