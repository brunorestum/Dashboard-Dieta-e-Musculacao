<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Progresso</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.22.13/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #12110F;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }
    * { box-sizing: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts || {};

    // ============================================================
    // DADOS HISTÓRICOS E ATUAIS COMPLETOS
    // ============================================================

    const META_VOCE = { proteina: 160, carbo: 205, gordura: 60, kcal: 2000 };
    const META_ESPOSA = { proteina: 110, carbo: 139, gordura: 45, kcal: 1400 };

    const PESO_HISTORICO_VOCE = [{ data: "06/08", peso: 70.88 }];

    const ALIMENTOS_VOCE = [
      { data: "06/08", alimento: "Whey da foto (22g)", proteina: 17.3, carbo: 1.5, gordura: 0.7 },
      { data: "06/08", alimento: "Banana (1 unidade média, ~100g)", proteina: 1.4, carbo: 23.8, gordura: 0.1 },
      { data: "06/08", alimento: "Morango (30g)", proteina: 0.2, carbo: 2.1, gordura: 0 },
      { data: "06/08", alimento: "Abacaxi (50g)", proteina: 0.3, carbo: 6.1, gordura: 0.05 },
      { data: "06/08", alimento: "Cacau em pó 100% (8g)", proteina: 1.9, carbo: 1.5, gordura: 1.0 },
      { data: "06/08", alimento: "Iogurte da foto (157g)", proteina: 18.1, carbo: 4.7, gordura: 0 },
      { data: "06/08", alimento: "Castanha do Pará (10g)", proteina: 1.4, carbo: 1.6, gordura: 6.3 },
      { data: "06/08", alimento: "Frango (110g)", proteina: 34.1, carbo: 0, gordura: 3.8 },
      { data: "06/08", alimento: "Aipim cozido (90g)", proteina: 0.5, carbo: 27.0, gordura: 0.3 },
      { data: "06/08", alimento: "Batata baroa cozida (90g)", proteina: 0.9, carbo: 18.0, gordura: 0.2 },
      { data: "06/08", alimento: "Legumes refogados/pimentão (135g)", proteina: 1.8, carbo: 8.5, gordura: 0.3 },
      { data: "06/08", alimento: "Salada verde com tomate cereja e cenoura (50g)", proteina: 0.7, carbo: 2.2, gordura: 0.1 },
      { data: "06/08", alimento: "Ovo de codorna (1 unidade, ~10g)", proteina: 1.3, carbo: 0.1, gordura: 1.1 },
      { data: "06/08", alimento: "Azeite (3ml)", proteina: 0, carbo: 0, gordura: 2.8 }
    ];

    const ALIMENTOS_ESPOSA = [
      { data: "06/08", alimento: "Morango (30g)", proteina: 0.2, carbo: 2.1, gordura: 0 },
      { data: "06/08", alimento: "Abacaxi (70g)", proteina: 0.4, carbo: 8.5, gordura: 0.1 },
      { data: "06/08", alimento: "Body Protein (1 scoop, ~20g)", proteina: 15.0, carbo: 0, gordura: 0 },
      { data: "06/08", alimento: "Frango grelhado (estimado ~100g)", proteina: 31.0, carbo: 0, gordura: 3.5 },
      { data: "06/08", alimento: "Batata baroa cozida (estimado ~100g)", proteina: 1.0, carbo: 20.0, gordura: 0.2 },
      { data: "06/08", alimento: "Legumes refogados/pimentão (estimado ~15g)", proteina: 0.2, carbo: 1.0, gordura: 0.05 },
      { data: "06/08", alimento: "Salada verde com tomate cereja e cenoura (estimado ~40g)", proteina: 0.5, carbo: 1.8, gordura: 0.1 },
      { data: "06/08", alimento: "Ovo de codorna (1 unidade, ~10g)", proteina: 1.3, carbo: 0.1, gordura: 1.1 },
      { data: "06/08", alimento: "Azeite (estimado ~2ml)", proteina: 0, carbo: 0, gordura: 1.8 }
    ];

    const TREINO_VOCE = [
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Elevação pélvica", carga: 90, unidade: "lbs" },
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Cadeira abdutora movimento", carga: 80, unidade: "lbs" },
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Glúteo no caixote", carga: 12, unidade: "kg" },
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Flexora em pé", carga: 25, unidade: "kg" },
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Mesa flexora", carga: 9, unidade: "pinos" },
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Cadeira flexora", carga: 9, unidade: "pinos" },
      { data: "06/08", sessao: "Glúteo e Posterior", exercicio: "Cadeira abdutora", carga: 8, unidade: "pinos grandes" }
    ];

    const TREINO_ESPOSA_NOME = "Raissa";
    const TREINO_ESPOSA = [];

    const CARDIO_VOCE = [
      { data: "04/08", atividade: "Esteira (Life Fitness, 3.27mi, MET 7.2)", minutos: 46.4, met: 7.2, kcalReal: 426 },
    ];
    
    // Atualizado com os novos dados da Raissa
    const CARDIO_ESPOSA = [
      { data: "05/08", atividade: "Esteira (4,5 km/h)", minutos: 45, met: 3.5 },
      { data: "06/08", atividade: "Esteira (5,5 km/h)", minutos: 30, met: 5.3 },
    ];

    const COLORS = {
      bg: "#12110F",
      panel: "#1B1917",
      panelBorder: "#2C2924",
      cream: "#F4EFE6",
      muted: "#9A9184",
      protein: "#E8A458",
      carb: "#7FA88F",
      fat: "#C97B63",
      voce: "#E8A458",
      esposa: "#7FA88F",
      track: "#2C2924",
    };

    const PESO_USUARIO_KG = 70.88;
    const PESO_RAISSA_KG = 50;

    function kcalCardio(met, pesoKg, minutos, kcalReal) {
      if (kcalReal != null) return kcalReal;
      return Math.round(met * pesoKg * (minutos / 60));
    }

    function kcalFromMacro(p, c, g) {
      return Math.round(p * 4 + c * 4 + g * 9);
    }

    function dataParaOrdenar(dataStr) {
      const [dia, mes] = dataStr.split("/").map(Number);
      return mes * 100 + dia;
    }

    function kcalMusculacaoSessao(pesoKg, horas = 1) {
      return Math.round(4.5 * pesoKg * horas);
    }

    function RingStat({ label, value, meta, unit, color }) {
      const pct = Math.min(100, (value / meta) * 100);
      const r = 42;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      const over = value > meta;

      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
          <div style={{ position: "relative", width: 100, height: 100 }}>
            <svg width="100" height="100" viewBox="0 0 100 100" style={{ transform: "rotate(-90deg)" }}>
              <circle cx="50" cy="50" r={r} fill="none" stroke={COLORS.track} strokeWidth="7" />
              <circle
                cx="50"
                cy="50"
                r={r}
                fill="none"
                stroke={over ? "#C97B63" : color}
                strokeWidth="7"
                strokeDasharray={circ}
                strokeDashoffset={offset}
                strokeLinecap="round"
                style={{ transition: "stroke-dashoffset 0.6s ease" }}
              />
            </svg>
            <div
              style={{
                position: "absolute",
                inset: 0,
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                justifyContent: "center",
              }}
            >
              <span style={{ fontSize: 20, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                {value}
              </span>
              <span style={{ fontSize: 10, color: COLORS.muted }}>/{meta}{unit}</span>
            </div>
          </div>
          <span style={{ fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted }}>
            {label}
          </span>
        </div>
      );
    }

    function BarraContribuicao({ alimento, proteina, carbo, gordura }) {
      const total = proteina + carbo + gordura;
      const pP = total ? (proteina / total) * 100 : 0;
      const pC = total ? (carbo / total) * 100 : 0;
      const pG = total ? (gordura / total) * 100 : 0;
      const kcal = kcalFromMacro(proteina, carbo, gordura);

      return (
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
            <span style={{ fontSize: 13, color: COLORS.cream }}>{alimento}</span>
            <span style={{ fontSize: 12, color: COLORS.muted }}>{kcal} kcal</span>
          </div>
          <div style={{ display: "flex", height: 8, borderRadius: 4, overflow: "hidden", background: COLORS.track }}>
            {pP > 0 && <div style={{ width: `${pP}%`, background: COLORS.protein }} />}
            {pC > 0 && <div style={{ width: `${pC}%`, background: COLORS.carb }} />}
            {pG > 0 && <div style={{ width: `${pG}%`, background: COLORS.fat }} />}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
            <span style={{ fontSize: 11, color: COLORS.protein }}>P {proteina}g</span>
            <span style={{ fontSize: 11, color: COLORS.carb }}>C {carbo}g</span>
            <span style={{ fontSize: 11, color: COLORS.fat }}>G {gordura}g</span>
          </div>
        </div>
      );
    }

    function MacrosPanel({ titulo, alimentos, meta }) {
      const dias = useMemo(() => {
        const seen = [];
        alimentos.forEach((a) => {
          if (!seen.includes(a.data)) seen.push(a.data);
        });
        return seen.sort((a, b) => dataParaOrdenar(a) - dataParaOrdenar(b));
      }, [alimentos]);

      const [diaSelecionado, setDiaSelecionado] = useState(dias[dias.length - 1] || null);
      const diaValido = dias.includes(diaSelecionado) ? diaSelecionado : dias[dias.length - 1];

      const alimentosDoDia = alimentos
        .filter((a) => a.data === diaValido)
        .slice()
        .sort((a, b) => kcalFromMacro(b.proteina, b.carbo, b.gordura) - kcalFromMacro(a.proteina, a.carbo, a.gordura));

      const p = alimentosDoDia.reduce((s, a) => s + a.proteina, 0);
      const c = alimentosDoDia.reduce((s, a) => s + a.carbo, 0);
      const g = alimentosDoDia.reduce((s, a) => s + a.gordura, 0);
      const kcal = kcalFromMacro(p, c, g);
      const kcalMeta = meta.kcal;

      return (
        <div style={panelStyle}>
          <div style={panelHeader}>
            <div>
              <div style={eyebrow}>Nutrição</div>
              <h2 style={panelTitle}>{titulo}</h2>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                {kcal}
                <span style={{ fontSize: 14, color: COLORS.muted, fontWeight: 400 }}> / {kcalMeta} kcal</span>
              </div>
            </div>
          </div>

          {dias.length === 0 ? (
            <EmptyState text="Nenhum registro ainda." />
          ) : (
            <>
              {dias.length > 1 && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 16 }}>
                  {dias.map((d) => (
                    <button
                      key={d}
                      onClick={() => setDiaSelecionado(d)}
                      style={{
                        padding: "6px 12px",
                        borderRadius: 20,
                        border: `1px solid ${d === diaValido ? COLORS.protein : COLORS.panelBorder}`,
                        background: d === diaValido ? `${COLORS.protein}22` : "transparent",
                        color: d === diaValido ? COLORS.cream : COLORS.muted,
                        fontSize: 12,
                        cursor: "pointer",
                        fontFamily: "inherit",
                      }}
                    >
                      {d}
                    </button>
                  ))}
                </div>
              )}

              <div style={{ display: "flex", justifyContent: "space-around", padding: "24px 0" }}>
                <RingStat label="Proteína" value={Math.round(p * 10) / 10} meta={meta.proteina} unit="g" color={COLORS.protein} />
                <RingStat label="Carboidrato" value={Math.round(c * 10) / 10} meta={meta.carbo} unit="g" color={COLORS.carb} />
                <RingStat label="Gordura" value={Math.round(g * 10) / 10} meta={meta.gordura} unit="g" color={COLORS.fat} />
              </div>

              <div style={{ marginTop: 4 }}>
                <div style={eyebrow}>Contribuição por alimento</div>
                <div style={{ marginTop: 12 }}>
                  {alimentosDoDia.map((a, i) => (
                    <BarraContribuicao key={i} alimento={a.alimento} proteina={a.proteina} carbo={a.carbo} gordura={a.gordura} />
                  ))}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function EmptyState({ text }) {
      return (
        <div
          style={{
            padding: "40px 20px",
            textAlign: "center",
            color: COLORS.muted,
            fontSize: 13,
            border: `1px dashed ${COLORS.panelBorder}`,
            borderRadius: 10,
            marginTop: 12,
          }}
        >
          {text}
        </div>
      );
    }

    function TreinoPanel({ titulo, dados, cor, pesoKg }) {
      const sessoes = useMemo(() => Array.from(new Set(dados.map((d) => d.sessao || "Geral"))), [dados]);
      const [sessaoSelecionada, setSessaoSelecionada] = useState(sessoes[0] || null);
      
      const dadosDaSessao = dados.filter((d) => (d.sessao || "Geral") === sessaoSelecionada);
      const nomesExercicios = Array.from(new Set(dadosDaSessao.map((d) => d.exercicio)));
      const [exercicioProgresso, setExercicioProgresso] = useState(nomesExercicios[0] || null);

      return (
        <div style={panelStyle}>
          <div style={panelHeader}>
            <div>
              <div style={eyebrow}>Treino</div>
              <h2 style={panelTitle}>{titulo}</h2>
            </div>
          </div>
          {sessoes.length === 0 ? <EmptyState text="Sem registros de treino." /> : (
            <>
              {sessoes.length > 1 && (
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 16 }}>
                  {sessoes.map((s) => (
                    <button key={s} onClick={() => setSessaoSelecionada(s)} style={{ padding: "5px 12px", borderRadius: 8, border: "none", background: s === sessaoSelecionada ? COLORS.cream : "transparent", color: s === sessaoSelecionada ? COLORS.bg : COLORS.muted, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{s}</button>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function CardioPanel({ titulo, dados, cor, pesoKg }) {
      return (
        <div style={panelStyle}>
          <div style={panelHeader}>
            <div>
              <div style={eyebrow}>Cardio</div>
              <h2 style={panelTitle}>{titulo}</h2>
            </div>
          </div>
          {dados.length === 0 ? <EmptyState text="Sem registros de cardio." /> : (
            <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
              {dados.map((d, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "10px 12px", background: COLORS.bg, borderRadius: 8, border: `1px solid ${COLORS.panelBorder}` }}>
                  <div>
                    <div style={{ fontSize: 13, color: COLORS.cream }}>{d.atividade}</div>
                    <div style={{ fontSize: 11, color: COLORS.muted }}>{d.data} · {d.minutos} min</div>
                  </div>
                  <span style={{ fontSize: 13, color: cor, fontWeight: 600 }}>~{kcalCardio(d.met, pesoKg, d.minutos)} kcal</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const panelStyle = { background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 16, padding: 24 };
    const panelHeader = { display: "flex", justifyContent: "space-between", alignItems: "flex-start" };
    const eyebrow = { fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted, marginBottom: 4 };
    const panelTitle = { fontSize: 22, fontWeight: 600, color: COLORS.cream, fontFamily: "'Fraunces', serif", margin: 0 };
    const SectionLabel = ({ text }) => <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: COLORS.muted, margin: "8px 4px" }}>{text}</div>;

    function Dashboard() {
      return (
        <div style={{ minHeight: "100vh", background: COLORS.bg, padding: "32px 20px", fontFamily: "'Inter', sans-serif" }}>
          <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", gap: 20 }}>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 32, color: COLORS.cream, margin: "0 0 16px" }}>Progresso</h1>
            
            <SectionLabel text="Você" />
            <MacrosPanel titulo="Macros" alimentos={ALIMENTOS_VOCE} meta={META_VOCE} />
            <TreinoPanel titulo="Seu treino" dados={TREINO_VOCE} cor={COLORS.voce} pesoKg={PESO_USUARIO_KG} />
            <CardioPanel titulo="Seu cardio" dados={CARDIO_VOCE} cor={COLORS.voce} pesoKg={PESO_USUARIO_KG} />

            <SectionLabel text={TREINO_ESPOSA_NOME} />
            <MacrosPanel titulo={`Macros · ${TREINO_ESPOSA_NOME}`} alimentos={ALIMENTOS_ESPOSA} meta={META_ESPOSA} />
            <TreinoPanel titulo={`Treino · ${TREINO_ESPOSA_NOME}`} dados={TREINO_ESPOSA} cor={COLORS.esposa} pesoKg={PESO_RAISSA_KG} />
            <CardioPanel titulo={`Cardio · ${TREINO_ESPOSA_NOME}`} dados={CARDIO_ESPOSA} cor={COLORS.esposa} pesoKg={PESO_RAISSA_KG} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
