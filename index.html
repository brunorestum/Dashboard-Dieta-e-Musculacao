    const TREINO_VOCE = [

    const TREINO_ESPOSA_NOME = "Raissa";
    const TREINO_ESPOSA = [

    ];

    const CARDIO_VOCE = [
      { data: "04/08", atividade: "Esteira (Life Fitness, 3.27mi, MET 7.2)", minutos: 46.4, met: 7.2, kcalReal: 426 },
    ];
    
    const CARDIO_ESPOSA = [
      { data: "02/08", atividade: "Caminhada 5,5 km/h", minutos: 40, met: 5.3 },
      { data: "03/08", atividade: "Esteira 5,5 km/h", minutos: 45, met: 5.3 },
      { data: "04/08", atividade: "Cardio 5,5 km/h", minutos: 45, met: 5.3 },
    ];

    // ============================================================
    // LÓGICA E UI
    // ============================================================

    const COLORS = {
      bg: "#12110F", panel: "#1B1917", panelBorder: "#2C2924",
      cream: "#F4EFE6", muted: "#9A9184",
      protein: "#E8A458", carb: "#7FA88F", fat: "#C97B63",
      voce: "#E8A458", esposa: "#7FA88F", track: "#2C2924",
    };

    const PESO_USUARIO_KG = 69.4;
    const PESO_RAISSA_KG = 50;

    function kcalCardio(met, pesoKg, minutos, kcalReal) {
      if (kcalReal != null) return kcalReal;
      return Math.round(met * pesoKg * (minutos / 60));
    }

    function kcalFromMacro(p, c, g) {
      return Math.round(p * 4 + c * 4 + g * 9);
    }

    function dataParaOrdenar(dataStr) {
      const [dia, mes] = dataStr.split("/").map(Number);
      return mes * 100 + dia;
    }

    function EmptyState({ text }) {
      return (
        <div style={{ padding: "32px 16px", textAlign: "center", color: COLORS.muted, fontSize: 13, border: `1px dashed ${COLORS.panelBorder}`, borderRadius: 10, marginTop: 16 }}>
          {text}
        </div>
      );
    }

    function RingStat({ label, value, meta, unit, color }) {
      const pct = Math.min(100, (value / meta) * 100);
      const r = 38;
      const circ = 2 * Math.PI * r;
      const offset = circ - (pct / 100) * circ;
      const over = value > meta;

      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
          <div style={{ position: "relative", width: 90, height: 90 }}>
            <svg width="90" height="90" viewBox="0 0 90 90" style={{ transform: "rotate(-90deg)" }}>
              <circle cx="45" cy="45" r={r} fill="none" stroke={COLORS.track} strokeWidth="6" />
              <circle
                cx="45" cy="45" r={r} fill="none"
                stroke={over ? "#C97B63" : color} strokeWidth="6"
                strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
                style={{ transition: "stroke-dashoffset 0.6s ease" }}
              />
            </svg>
            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <span style={{ fontSize: 18, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>{value}</span>
              <span style={{ fontSize: 10, color: COLORS.muted }}>/{meta}{unit}</span>
            </div>
          </div>
          <span style={{ fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: COLORS.muted }}>{label}</span>
        </div>
      );
    }

    function BarraContribuicao({ alimento, proteina, carbo, gordura }) {
      const total = proteina + carbo + gordura;
      const pP = total ? (proteina / total) * 100 : 0;
      const pC = total ? (carbo / total) * 100 : 0;
      const pG = total ? (gordura / total) * 100 : 0;
      const kcal = kcalFromMacro(proteina, carbo, gordura);

      return (
        <div style={{ marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
            <span style={{ fontSize: 13, color: COLORS.cream, fontWeight: 500 }}>{alimento}</span>
            <span style={{ fontSize: 12, color: COLORS.muted }}>{kcal} kcal</span>
          </div>
          <div style={{ display: "flex", height: 6, borderRadius: 3, overflow: "hidden", background: COLORS.track }}>
            {pP > 0 && <div style={{ width: `${pP}%`, background: COLORS.protein }} />}
            {pC > 0 && <div style={{ width: `${pC}%`, background: COLORS.carb }} />}
            {pG > 0 && <div style={{ width: `${pG}%`, background: COLORS.fat }} />}
          </div>
          <div style={{ display: "flex", gap: 12, marginTop: 6 }}>
            <span style={{ fontSize: 11, color: COLORS.protein, fontWeight: 600 }}>P {proteina}g</span>
            <span style={{ fontSize: 11, color: COLORS.carb, fontWeight: 600 }}>C {carbo}g</span>
            <span style={{ fontSize: 11, color: COLORS.fat, fontWeight: 600 }}>G {gordura}g</span>
          </div>
        </div>
      );
    }

    function MacrosPanel({ titulo, alimentos, meta }) {
      const dias = useMemo(() => {
        const seen = [];
        alimentos.forEach((a) => { if (!seen.includes(a.data)) seen.push(a.data); });
        return seen.sort((a, b) => dataParaOrdenar(a) - dataParaOrdenar(b));
      }, [alimentos]);

      const [diaSelecionado, setDiaSelecionado] = useState("05/08");
      const diaValido = dias.includes(diaSelecionado) ? diaSelecionado : dias[dias.length - 1];

      const alimentosDoDia = alimentos
        .filter((a) => a.data === diaValido)
        .slice()
        .sort((a, b) => kcalFromMacro(b.proteina, b.carbo, b.gordura) - kcalFromMacro(a.proteina, a.carbo, a.gordura));

      const p = alimentosDoDia.reduce((s, a) => s + a.proteina, 0);
      const c = alimentosDoDia.reduce((s, a) => s + a.carbo, 0);
      const g = alimentosDoDia.reduce((s, a) => s + a.gordura, 0);
      const kcal = kcalFromMacro(p, c, g);

      return (
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 16, padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted, marginBottom: 4 }}>Nutrição</div>
              <h2 style={{ fontSize: 22, fontWeight: 600, color: COLORS.cream, fontFamily: "'Fraunces', serif", margin: 0 }}>{titulo}</h2>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 26, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                {kcal}
                <span style={{ fontSize: 13, color: COLORS.muted, fontWeight: 400, fontFamily: "'Inter', sans-serif" }}> / {meta.kcal} kcal</span>
              </div>
            </div>
          </div>

          {dias.length > 0 && (
            <>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 16 }}>
                {dias.map((d) => (
                  <button
                    key={d} onClick={() => setDiaSelecionado(d)}
                    style={{
                      padding: "6px 14px", borderRadius: 20,
                      border: `1px solid ${d === diaValido ? COLORS.protein : COLORS.panelBorder}`,
                      background: d === diaValido ? `${COLORS.protein}11` : "transparent",
                      color: d === diaValido ? COLORS.cream : COLORS.muted,
                      fontSize: 12, fontWeight: d === diaValido ? 600 : 400,
                      cursor: "pointer", fontFamily: "inherit", transition: "all 0.2s ease"
                    }}
                  >
                    {d}
                  </button>
                ))}
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", padding: "28px 0" }}>
                <RingStat label="Proteína" value={Math.round(p * 10) / 10} meta={meta.proteina} unit="g" color={COLORS.protein} />
                <RingStat label="Carboidrato" value={Math.round(c * 10) / 10} meta={meta.carbo} unit="g" color={COLORS.carb} />
                <RingStat label="Gordura" value={Math.round(g * 10) / 10} meta={meta.gordura} unit="g" color={COLORS.fat} />
              </div>

              <div style={{ marginTop: 8 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted, marginBottom: 16 }}>Contribuição por alimento</div>
                <div>
                  {alimentosDoDia.map((a, i) => (
                    <BarraContribuicao key={i} alimento={a.alimento} proteina={a.proteina} carbo={a.carbo} gordura={a.gordura} />
                  ))}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function TreinoPanel({ titulo, dados, cor }) {
      const sessoes = useMemo(() => {
        const set = new Set(dados.map((d) => d.sessao || "Geral"));
        return Array.from(set);
      }, [dados]);

      const [sessaoSelecionada, setSessaoSelecionada] = useState(sessoes[0] || null);

      const dadosDaSessao = useMemo(
        () => dados.filter((d) => (d.sessao || "Geral") === sessaoSelecionada),
        [dados, sessaoSelecionada]
      );

      const nomesExercicios = useMemo(() => {
        const set = new Set(dadosDaSessao.map((d) => d.exercicio));
        return Array.from(set);
      }, [dadosDaSessao]);

      const [exercicioProgresso, setExercicioProgresso] = useState(nomesExercicios[0] || null);
      const exercicioValido = nomesExercicios.includes(exercicioProgresso) ? exercicioProgresso : nomesExercicios[0];

      const serieProgresso = dadosDaSessao
        .filter((d) => d.exercicio === exercicioValido)
        .slice()
        .sort((a, b) => dataParaOrdenar(a.data) - dataParaOrdenar(b.data));
        
      const unidade = serieProgresso.length ? (serieProgresso[0].unidade || "kg") : "kg";
      const cargaAtual = serieProgresso.length ? serieProgresso[serieProgresso.length - 1].carga : null;

      const trocarSessao = (s) => {
        setSessaoSelecionada(s);
        setExercicioProgresso(null);
      };

      return (
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 16, padding: 24 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted, marginBottom: 4 }}>Treino</div>
            <h2 style={{ fontSize: 22, fontWeight: 600, color: COLORS.cream, fontFamily: "'Fraunces', serif", margin: 0 }}>{titulo}</h2>
          </div>

          {sessoes.length === 0 ? (
            <EmptyState text="Sem registros de treino ainda." />
          ) : (
            <>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 16 }}>
                {sessoes.map((s) => (
                  <button
                    key={s} onClick={() => trocarSessao(s)}
                    style={{
                      padding: "5px 12px", borderRadius: 8, border: "none",
                      background: s === sessaoSelecionada ? COLORS.cream : "transparent",
                      color: s === sessaoSelecionada ? COLORS.bg : COLORS.muted,
                      fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit"
                    }}
                  >
                    {s}
                  </button>
                ))}
              </div>

              {nomesExercicios.length > 0 && (
                <div style={{ marginTop: 20 }}>
                  <div style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted }}>Exercício</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "8px 0 16px" }}>
                    {nomesExercicios.map((n) => (
                      <button
                        key={n} onClick={() => setExercicioProgresso(n)}
                        style={{
                          padding: "6px 12px", borderRadius: 20,
                          border: `1px solid ${n === exercicioValido ? cor : COLORS.panelBorder}`,
                          background: n === exercicioValido ? `${cor}22` : "transparent",
                          color: n === exercicioValido ? COLORS.cream : COLORS.muted,
                          fontSize: 12, cursor: "pointer", fontFamily: "inherit"
                        }}
                      >
                        {n}
                      </button>
                    ))}
                  </div>

                  {cargaAtual != null && (
                    <div style={{ marginBottom: 12 }}>
                      <span style={{ fontSize: 24, fontWeight: 700, color: COLORS.cream, fontFamily: "'Fraunces', serif" }}>
                        {cargaAtual}{unidade}
                      </span>
                    </div>
                  )}

                  <div style={{ height: 160 }}>
                    <ResponsiveContainer width="100%" height="100%">
                      <LineChart data={serieProgresso} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
                        <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                        <XAxis dataKey="data" stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                        <YAxis stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} unit={unidade} />
                        <Tooltip contentStyle={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8 }} labelStyle={{ color: COLORS.cream }} />
                        <Line type="monotone" dataKey="carga" stroke={cor} strokeWidth={2.5} dot={{ r: 4, fill: cor }} name={`Carga (${unidade})`} />
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function CardioPanel({ titulo, dados, cor, pesoKg }) {
      const dias = useMemo(() => {
        const seen = [];
        dados.forEach((d) => { if (!seen.includes(d.data)) seen.push(d.data); });
        return seen;
      }, [dados]);

      const chartData = dias.map((d) => {
        const itens = dados.filter((x) => x.data === d);
        const kcal = itens.reduce((s, x) => s + kcalCardio(x.met, pesoKg, x.minutos, x.kcalReal), 0);
        return { data: d, kcal };
      });

      return (
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 16, padding: 24 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.muted, marginBottom: 4 }}>Cardio</div>
            <h2 style={{ fontSize: 22, fontWeight: 600, color: COLORS.cream, fontFamily: "'Fraunces', serif", margin: 0 }}>{titulo}</h2>
          </div>

          {dados.length === 0 ? (
            <EmptyState text="Sem registros de cardio ainda." />
          ) : (
            <>
              <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
                {dados.map((d, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "12px", background: COLORS.bg, borderRadius: 8, border: `1px solid ${COLORS.panelBorder}` }}>
                    <div>
                      <div style={{ fontSize: 13, color: COLORS.cream, fontWeight: 500 }}>{d.atividade}</div>
                      <div style={{ fontSize: 11, color: COLORS.muted, marginTop: 4 }}>{d.data} · {d.minutos} min</div>
                    </div>
                    <span style={{ fontSize: 13, color: cor, fontWeight: 600 }}>
                      {d.kcalReal != null ? "" : "~"}{kcalCardio(d.met, pesoKg, d.minutos, d.kcalReal)} kcal
                    </span>
                  </div>
                ))}
              </div>

              {chartData.length > 1 && (
                <div style={{ height: 160, marginTop: 24 }}>
                  <ResponsiveContainer width="100%" height="100%">
                    <LineChart data={chartData} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
                      <CartesianGrid stroke={COLORS.panelBorder} strokeDasharray="3 3" vertical={false} />
                      <XAxis dataKey="data" stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                      <YAxis stroke={COLORS.muted} fontSize={11} tickLine={false} axisLine={false} />
                      <Tooltip contentStyle={{ background: COLORS.panel, border: `1px solid ${COLORS.panelBorder}`, borderRadius: 8 }} labelStyle={{ color: COLORS.cream }} />
                      <Line type="monotone" dataKey="kcal" stroke={cor} strokeWidth={2.5} dot={{ r: 4, fill: cor }} name="Kcal gastas" />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function Dashboard() {
      return (
        <div style={{ minHeight: "100vh", padding: "40px 20px", fontFamily: "'Inter', -apple-system, sans-serif" }}>
          <div style={{ maxWidth: 480, margin: "0 auto 32px" }}>
            <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: COLORS.muted }}>Painel diário</div>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 34, color: COLORS.cream, margin: "4px 0 0", fontWeight: 500 }}>Progresso</h1>
          </div>

          <div style={{ maxWidth: 480, margin: "0 auto", display: "flex", flexDirection: "column", gap: 16 }}>
            <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: COLORS.muted, margin: "16px 4px 8px" }}>Você</div>
            <MacrosPanel titulo="Macros" alimentos={ALIMENTOS_VOCE} meta={META_VOCE} />
            <TreinoPanel titulo="Seu treino" dados={TREINO_VOCE} cor={COLORS.voce} pesoKg={PESO_USUARIO_KG} />
            <CardioPanel titulo="Seu cardio" dados={CARDIO_VOCE} cor={COLORS.voce} pesoKg={PESO_USUARIO_KG} />
            
            <div style={{ fontSize: 11, letterSpacing: "0.15em", textTransform: "uppercase", color: COLORS.muted, margin: "32px 4px 8px" }}>Raissa</div>
            <MacrosPanel titulo="Macros · Raissa" alimentos={ALIMENTOS_ESPOSA} meta={META_ESPOSA} />
            <TreinoPanel titulo="Treino · Raissa" dados={TREINO_ESPOSA} cor={COLORS.esposa} pesoKg={PESO_RAISSA_KG} />
            <CardioPanel titulo="Cardio · Raissa" dados={CARDIO_ESPOSA} cor={COLORS.esposa} pesoKg={PESO_RAISSA_KG} />
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
